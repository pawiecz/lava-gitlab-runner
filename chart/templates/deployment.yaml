apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lava-gitlab-runner.fullname" . }}
  labels:
    {{- include "lava-gitlab-runner.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "lava-gitlab-runner.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/lava-token-secret.yaml") . | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "lava-gitlab-runner.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- if .Values.artifactUpload.baseUrl }}
          ports:
            - name: upload
              containerPort: {{ .Values.artifactUpload.port }}
              protocol: TCP
          {{- end }}
          env:
            - name: GITLAB_URL
              value: {{ .Values.gitlab.url }}
            - name: GITLAB_TOKEN
              valueFrom:
               secretKeyRef:
                 name: gitlab-token
                 key: token
            - name: ALLOWED_HOSTS
              value: '*'
            - name: RUNNER_LOG
              value: {{ .Values.loglevel }}
            - name: RUNNER_MAX_CONCURRENT_REQUESTS
              value: "{{ .Values.max_concurrent_requests }}"
            {{- if .Values.artifactUpload.baseUrl }}
            - name: LAVA_ARTIFACT_UPLOAD_BASE_URL
              value: {{ .Values.artifactUpload.baseUrl | quote }}
            - name: LAVA_ARTIFACT_UPLOAD_LISTEN_ADDR
              value: "0.0.0.0:{{ .Values.artifactUpload.port }}"
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
